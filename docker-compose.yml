services:
  nginx-proxy-manager:
    image: jc21/nginx-proxy-manager:latest
    container_name: proxy-manager
    restart: always

    ports:
      - "80:80"      # HTTP
      - "81:81"      # Administración
      - "443:443"    # HTTPS

    volumes:
      - ./npm_data:/data
      - ./npm_letsencrypt:/etc/letsencrypt

    networks:
      - red-cba

  servidor-bd:
    image: mysql:8.0
    container_name: servidor-bd
    restart: always

    env_file:
      - .env

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}

    ports:
      - "3306:3306"

    volumes:
      - mysql-data:/var/lib/mysql

    networks:
      - red-cba

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  app-backend:
    image: dimarco007/app-backend:v2
    container_name: app-backend
    restart: always
    build: .

    depends_on:
      servidor-bd:
        condition: service_healthy

    env_file:
      - .env

    ports:
      - "${FLASK_PORT}:5050"

    volumes:
      - .:/home/myapp

    networks:
      - red-cba

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5050"]
      interval: 10s
      timeout: 30s
      retries: 3
      start_period: 30s

  uptime-kuma:
    image: louislam/uptime-kuma:1.20.0
    container_name: uptime-kuma
    restart: always

    ports:
      - "3001:3001"

    volumes:
      - uptime-kuma-data:/app/data

    networks:
      - red-cba

networks:
  red-cba:
    driver: bridge

volumes:
  mysql-data:
    name: mysql-data
  uptime-kuma-data:
    name: uptime-kuma-data